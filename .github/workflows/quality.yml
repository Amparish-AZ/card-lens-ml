name: Quality

on:
  push:
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - run: python -m pip install -e "ml[dev]"
      - run: ruff check ml/src ml/tests ml/scripts
      - run: mypy ml/src ml/tests
      - run: pytest ml/tests
      - run: python -m cardlens_ml validate-dataset --dataset ml/data/example
      - run: python -m cardlens_ml list-ner-registry --registry ml/data/registry

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
